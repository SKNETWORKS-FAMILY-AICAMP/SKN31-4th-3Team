# frontend/docker/nginx.conf
# ─────────────────────────────────────────────────────────────────────
# SPA + API 프록시.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 해시가 붙은 자산은 영원히 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ★ index.html 은 캐시하지 않는다.
    #   캐시되면 새 자산 해시를 가리키는 문서가 갱신되지 않아,
    #   배포 후에도 옛 화면이 계속 나온다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API 와 문서는 Django 로 넘긴다.
    location /api/ { proxy_pass http://api:8000; include /etc/nginx/proxy_params_eden; }
    location /admin/ { proxy_pass http://api:8000; include /etc/nginx/proxy_params_eden; }
    location /static/ { proxy_pass http://api:8000; include /etc/nginx/proxy_params_eden; }
    location /healthz { proxy_pass http://api:8000; include /etc/nginx/proxy_params_eden; }

    # ★ SPA 폴백.
    #   /verse/gen-1-3 을 새로고침하면 서버에 그런 파일이 없다.
    #   index.html 로 떨어뜨려야 라우터가 경로를 해석한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
