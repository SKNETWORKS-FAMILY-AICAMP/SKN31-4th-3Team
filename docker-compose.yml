# docker-compose.yml
# ─────────────────────────────────────────────────────────────────────
# 로컬에서 배포와 같은 모양으로 띄운다.
#
#   docker compose up --build
#   → http://localhost        프런트 (Nginx)
#   → http://localhost/api/   API   (Nginx → Django)
#   → http://localhost/api/v1/docs/  Swagger
#
# ★ 프런트도 Nginx 로 서빙한다.
#   AWS 에서는 S3+CloudFront 가 하는 일이지만, 로컬에서 같은 경로 규칙
#   (/api → Django, 그 외 → SPA)을 재현해 두어야 CORS·라우팅 문제가
#   배포 후가 아니라 여기서 드러난다.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eden
      POSTGRES_USER: eden
      POSTGRES_PASSWORD: eden-local-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 마이그레이션이 DB 보다 먼저 뜨면 첫 실행이 실패한다.
      test: ["CMD-SHELL", "pg_isready -U eden -d eden"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    environment:
      SECRET_KEY: local-development-only-not-a-real-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,api,nginx
      DATABASE_URL: postgres://eden:eden-local-only@db:5432/eden
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      args:
        # 같은 도메인의 /api 로 보낸다 — 브라우저 입장에서 CORS 가 없다.
        VITE_API_BASE_URL: ""
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
