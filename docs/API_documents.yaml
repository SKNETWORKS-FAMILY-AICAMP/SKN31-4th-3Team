openapi: 3.0.3
info:
  title: Chatbot Service API
  version: 1.0.0
  description: Django 기반 AI 챗봇 백엔드 API 문서입니다.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        본인 정보 조회·수정
        GET   /api/v1/auth/me/
        PATCH /api/v1/auth/me/   (MBTI 변경)
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      description: |-
        본인 정보 조회·수정
        GET   /api/v1/auth/me/
        PATCH /api/v1/auth/me/   (MBTI 변경)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdate'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: |-
        본인 정보 조회·수정
        GET   /api/v1/auth/me/
        PATCH /api/v1/auth/me/   (MBTI 변경)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdate'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        회원가입
        POST /api/v1/auth/register/
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/chat/sessions/:
    get:
      operationId: chat_sessions_list
      description: |-
        대화방 목록 조회 및 새 대화방 생성 API
        GET /api/v1/chat/sessions/
        POST /api/v1/chat/sessions/
      parameters:
      - name: page
        required: false
        in: query
        description: 페이지네이션된 결과 집합 내의 페이지 번호.
        schema:
          type: integer
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChatSessionList'
          description: ''
    post:
      operationId: chat_sessions_create
      description: |-
        대화방 목록 조회 및 새 대화방 생성 API
        GET /api/v1/chat/sessions/
        POST /api/v1/chat/sessions/
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSession'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatSession'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatSession'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: ''
  /api/v1/chat/sessions/{id}/:
    get:
      operationId: chat_sessions_retrieve
      description: |-
        특정 대화방 상세 조회 및 삭제 API
        GET /api/v1/chat/sessions/<int:pk>/
        DELETE /api/v1/chat/sessions/<int:pk>/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetail'
          description: ''
    delete:
      operationId: chat_sessions_destroy
      description: |-
        특정 대화방 상세 조회 및 삭제 API
        GET /api/v1/chat/sessions/<int:pk>/
        DELETE /api/v1/chat/sessions/<int:pk>/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/chat/sessions/{session_id}/completion/:
    post:
      operationId: chat_sessions_completion_create
      description: |-
        사용자 메시지를 받아 LLM 답변을 생성하고 DB에 기록하는 API(동기방식)
        POST /api/v1/chat/sessions/<session_id>/completion/
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendMessage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessage'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
          description: ''
  /api/v1/chat/sessions/{session_id}/messages/:
    get:
      operationId: chat_sessions_messages_list
      description: |-
        특정 대화방의 메시지 목록 조회 API
        GET /api/v1/chat/sessions/<int:session_id>/messages/
      parameters:
      - name: page
        required: false
        in: query
        description: 페이지네이션된 결과 집합 내의 페이지 번호.
        schema:
          type: integer
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChatMessageList'
          description: ''
  /api/v1/chat/sessions/{session_id}/stream/:
    post:
      operationId: chat_sessions_stream_create
      description: |-
        사용자 메시지를 받아 LLM 답변을 SSE 스트리밍으로 전송하고 DB에 기록하는 API(실시간 스트리밍 방식)
        POST /api/v1/chat/sessions/<session_id>/stream/
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendMessage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessage'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/v1/scripture/ask/:
    post:
      operationId: scripture_ask_create
      description: |-
        고민 → 공감·묵상·추천 구절.
        POST /api/v1/scripture/ask/

        ★ 여기서 위기 판정을 하더라도 프런트 판정을 대체하지 않는다.
          프런트는 요청 이전에 스스로 판정하고, 위기로 보이면 이 API 를
          호출하지 않는다. 서버가 죽어도 안전 안내는 떠야 하기 때문이다.
      tags:
      - scripture
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResult'
          description: ''
  /api/v1/scripture/galaxies/:
    get:
      operationId: scripture_galaxies_list
      description: |-
        은하 13개.
        GET /api/v1/scripture/galaxies/
      tags:
      - scripture
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Galaxy'
          description: ''
  /api/v1/scripture/verses/:
    get:
      operationId: scripture_verses_list
      description: |-
        구절 전체 (702개).
        GET /api/v1/scripture/verses/?galaxy=peter&depth=full

        ★ 페이지를 나누지 않는다.
          프런트는 첫 프레임에 전체 별을 그려야 한다. 나눠 받으면 은하가
          조각조각 나타난다. 700건 남짓이고 정적인 데이터라 한 번에 준다.
      tags:
      - scripture
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Verse'
          description: ''
  /api/v1/scripture/verses/{id}/:
    get:
      operationId: scripture_verses_retrieve
      description: |-
        구절 하나.
        GET /api/v1/scripture/verses/<slug>/
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - scripture
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verse'
          description: ''
components:
  schemas:
    AskRequest:
      type: object
      properties:
        question:
          type: string
          description: 사용자가 입력한 고민
          maxLength: 500
        attempt:
          type: integer
          maximum: 99
          minimum: 0
          default: 0
          description: '"다른 구절 보기"를 누른 횟수. variant 를 순환시킨다.'
      required:
      - question
    AskResult:
      type: object
      description: 응답 형태 고정용. 스키마 문서에 그대로 나온다.
      properties:
        question:
          type: string
        intent:
          type: string
        empathy:
          type: string
        reflection:
          type: string
        verse_ids:
          type: array
          items:
            type: string
        follow_ups:
          type: array
          items:
            type: string
      required:
      - empathy
      - follow_ups
      - intent
      - question
      - reflection
      - verse_ids
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session:
          type: integer
        role:
          $ref: '#/components/schemas/RoleEnum'
        content:
          type: string
        verse_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - role
      - session
      - verse_id
    ChatSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: string
          format: email
          readOnly: true
        title:
          type: string
          maxLength: 255
        seed_verse_id:
          type: string
          readOnly: true
        seed_question:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - seed_verse_id
      - updated_at
      - user
    ChatSessionDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: string
          format: email
          readOnly: true
        title:
          type: string
          maxLength: 255
        seed_verse_id:
          type: string
          readOnly: true
        seed_question:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          readOnly: true
      required:
      - created_at
      - id
      - messages
      - seed_verse_id
      - updated_at
      - user
    DepthEnum:
      enum:
      - full
      - brief
      type: string
      description: |-
        * `full` - 큐레이션
        * `brief` - 연관 구절
    Galaxy:
      type: object
      properties:
        id:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 32
        role:
          type: string
          maxLength: 64
        mbti:
          type: string
          maxLength: 4
        tint:
          type: string
          maxLength: 7
        is_center:
          type: boolean
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - mbti
      - name
      - role
    PaginatedChatMessageList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
    PaginatedChatSessionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ChatSession'
    PatchedUserUpdate:
      type: object
      description: |-
        본인 정보 수정. 지금은 MBTI 만 바꿀 수 있다.

        ★ 조회용과 나눠 두는 이유
          UserSerializer 는 모든 필드가 읽기 전용이다. 그걸 그대로 PATCH 에
          쓰면 요청은 200 을 돌려주는데 값은 바뀌지 않는다 — 화면에서는
          저장된 것처럼 보이고 새로고침하면 되돌아간다. 가장 찾기 어려운
          종류의 버그다.

        ★ 왜 PATCH 가 필요한가
          화면 오른쪽 목록에서 다른 유형을 골랐을 때 그 선택이 계정에 남아야
          한다. 이 엔드포인트가 없으면 유형은 가입 때 한 번 정하면 끝이 된다.
      properties:
        mbti:
          type: string
          maxLength: 4
    Register:
      type: object
      description: 회원가입 전용.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 8
        mbti:
          type: string
          maxLength: 4
      required:
      - email
      - id
      - mbti
      - password
      - username
    RoleEnum:
      enum:
      - user
      - assistant
      - system
      type: string
      description: |-
        * `user` - User
        * `assistant` - Assistant
        * `system` - System
    SendMessage:
      type: object
      properties:
        message:
          type: string
          description: 유저가 입력한 질문/메시지
      required:
      - message
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      description: 유저 정보 조회 전용.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        username:
          type: string
          readOnly: true
        mbti:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: 등록일
      required:
      - date_joined
      - email
      - id
      - mbti
      - username
    UserUpdate:
      type: object
      description: |-
        본인 정보 수정. 지금은 MBTI 만 바꿀 수 있다.

        ★ 조회용과 나눠 두는 이유
          UserSerializer 는 모든 필드가 읽기 전용이다. 그걸 그대로 PATCH 에
          쓰면 요청은 200 을 돌려주는데 값은 바뀌지 않는다 — 화면에서는
          저장된 것처럼 보이고 새로고침하면 되돌아간다. 가장 찾기 어려운
          종류의 버그다.

        ★ 왜 PATCH 가 필요한가
          화면 오른쪽 목록에서 다른 유형을 골랐을 때 그 선택이 계정에 남아야
          한다. 이 엔드포인트가 없으면 유형은 가입 때 한 번 정하면 끝이 된다.
      properties:
        mbti:
          type: string
          maxLength: 4
      required:
      - mbti
    Verse:
      type: object
      description: |-
        프런트의 VerseStar 에 대응한다.

        ★ 좌표(coord)는 보내지 않는다.
          프런트가 galaxy_id + order 로 파생시킨다. 서버가 좌표까지 들고
          있으면 배치 규칙을 고칠 때마다 DB 를 다시 써야 한다.
      properties:
        id:
          type: string
          maxLength: 32
        galaxy_id:
          type: string
          readOnly: true
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        book_code:
          type: string
          maxLength: 8
        book_name:
          type: string
          maxLength: 16
        chapter:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        verse:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        depth:
          $ref: '#/components/schemas/DepthEnum'
        summary:
          type: string
        themes: {}
        motif:
          type: string
          maxLength: 16
        magnitude:
          type: number
          format: double
        excerpt:
          type: string
